[package]
name = "glass_capture"
version = "0.1.0"
edition = "2024"
description = "Lightweight native Liquid Glass macOS capture-card viewer with Apple Silicon Neural Frame Generation & MetalFX Upscaling"
authors = ["GlassCapture"]

[[bin]]
name = "glass_capture"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
